version: '3'

dotenv: ['.env']

vars:
  # Use the proper Maven wrapper for Windows or Unix.
  MVNW: '{{if eq OS "windows"}}./mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  # Plain `task` lists tasks.
  default:
    silent: true
    cmds:
      - '{{.TASK_EXE | shellQuote}} --list --sort none'

  # === Prerequisites ===
  require-docker:
    internal: true
    preconditions:
      - sh: docker compose version
        msg: "Docker CLI and Compose plugin are required."
      - sh: docker info
        msg: "Docker daemon is not running or is inaccessible. Start Docker and check permissions."

  # === Docker ===
  up:
    desc: Start Docker containers
    deps: [require-docker]
    cmds:
      - docker compose up --build -d
      - docker compose ps --all

  down:
    desc: Stop Docker containers
    deps: [require-docker]
    cmds:
      - docker compose down
      - docker compose ps --all

  down-volumes:
    desc: Stop containers and remove volumes
    deps: [require-docker]
    cmds:
      - docker compose down -v
      - docker compose ps --all

  # === Application ===
  run:
    desc: Run the application locally
    deps: [require-docker]
    cmds:
      - '{{.MVNW}} spring-boot:run'

  test:
    desc: Run tests
    deps: [require-docker]
    cmds:
      - '{{.MVNW}} test'

  clean:
    desc: Remove generated build files
    cmds:
      - '{{.MVNW}} clean'

  # === Code quality ===
  verify:
    desc: Full build - tests, Spotless check, PMD
    deps: [require-docker]
    cmds:
      - '{{.MVNW}} clean verify'

  format:
    desc: Auto-format code with Spotless
    cmds:
      - '{{.MVNW}} spotless:apply'

  # === Nix ===
  update-flake:
    desc: Update flake.lock (requires Nix)
    preconditions:
      - sh: command -v nix
        msg: "Nix is not installed, this task is only for Nix users"
    cmds:
      - nix flake update
