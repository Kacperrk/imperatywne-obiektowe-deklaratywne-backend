spring:

  application:
    name: library-mvc

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Warn when a connection is held longer than expected.
      leak-detection-threshold: 60000 # 60s

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must not create or modify it.
      ddl-auto: none
    # Prevent lazy-loading outside explicit transactions.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          # Fail fast instead of silently paginating in memory.
          fail_on_pagination_over_collection_fetch: true

  mvc:
    problemdetails:
      enabled: true

  web:
    resources:
      add-mappings: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token:
      expiration: 15m
    refresh-token:
      expiration: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: ${spring.application.name}
    description: Library system (MVC backend)

logging:
  level:
    root: INFO
    com.library.mvc: DEBUG
